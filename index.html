<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chihoot</title>
<meta name="description" content="A Kahoot-style DSC 10 midterm review game: 19 timed questions on Lectures 1–12.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: night-game arena broadcast — one centered court column, scoreboard bar on top, answer tiles as the "floor", lower-third reveal panel */
:root {
  --night: #160f1e;
  --court: #221830;
  --court-2: #2c203d;
  --line: #3d2d52;
  --ink: #f7f0e3;
  --muted: #b9abc9;
  --gold: #f4b43a;
  --gold-deep: #c98a12;
  --good: #3fd28f;
  --bad: #ff5f6e;
  --t1: #f4b43a; --t2: #ff7b68; --t3: #38c6c0; --t4: #a283ff;
  --tile-ink: #1b1024;
  --display: "Anton", "Impact", "Arial Narrow", sans-serif;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night);
  background-image: radial-gradient(120% 60% at 50% -10%, #3a2154 0%, transparent 60%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
}
.wrap {
  max-width: 900px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
  display: flex; flex-direction: column; gap: 20px;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
code, pre { font-family: var(--mono); }

/* ticker */
.ticker { border-block: 1px solid var(--line); background: #1d1428; overflow: hidden; display: flex; align-items: center; }
.ticker .tag { flex: none; background: var(--gold); color: var(--tile-ink); font-family: var(--display); letter-spacing: .06em; padding: 6px 12px; font-size: 14px; }
.ticker .track { white-space: nowrap; display: inline-block; padding-left: 100%; animation: tick 70s linear infinite; font-size: 14px; color: var(--muted); }
.ticker .track span { margin-right: 48px; }
.ticker .track b { color: var(--ink); font-weight: 700; }
@keyframes tick { to { transform: translateX(-100%); } }
.ticker-view { overflow: hidden; flex: 1; min-width: 0; padding-block: 6px; }

/* start */
.hero { display: grid; grid-template-columns: 1.3fr 1fr; gap: 28px; align-items: end; padding-top: 12px; }
.eyebrow { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.wordmark { font-family: var(--display); font-size: clamp(64px, 15vw, 148px); line-height: .86; letter-spacing: .01em; margin: 8px 0 0; text-transform: uppercase; }
.wordmark .gold { color: var(--gold); display: block; }
.hero p.lede { color: var(--muted); max-width: 46ch; margin: 14px 0 0; text-wrap: pretty; }
.card { justify-self: end; width: 100%; max-width: 280px; background: linear-gradient(160deg, #3a2650, #1d1428 70%); border: 3px solid var(--gold); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 18px 40px rgba(0,0,0,.45); transform: rotate(2.5deg); }
.card .photo { position: relative; border-radius: 6px; overflow: hidden; aspect-ratio: 1; }
.card .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .num { position: absolute; top: 6px; left: 8px; font-family: var(--display); font-size: 44px; line-height: 1; color: var(--gold); text-shadow: 0 2px 0 rgba(0,0,0,.5); }
.card .badge { position: absolute; top: 10px; right: 10px; background: var(--gold); color: var(--tile-ink); font-size: 10px; font-weight: 800; letter-spacing: .14em; padding: 3px 7px; border-radius: 3px; }
.card .plate { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 0 4px; }
.card .plate b { font-family: var(--display); font-weight: 400; font-size: 30px; letter-spacing: .06em; text-transform: uppercase; line-height: 1; }
.card .plate span { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.card dl { display: grid; grid-template-columns: repeat(3, 1fr); margin: 0; border-top: 1px solid var(--line); padding: 8px 4px 2px; text-align: center; }
.card dt { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.card dd { margin: 0; font-family: var(--display); font-size: 22px; color: var(--gold); }
.avatar { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--gold); color: var(--tile-ink); font-family: var(--display); font-size: 14px; font-style: normal; letter-spacing: .04em; }
.card .photo.mono { display: grid; place-items: center; background: repeating-linear-gradient(135deg, #2c203d 0 14px, #251a34 14px 28px); }
.card .pc { font-family: var(--display); font-size: 120px; line-height: 1; color: var(--gold); text-shadow: 0 4px 0 rgba(0,0,0,.4); }
.react { display: flex; gap: 16px; align-items: center; background: var(--court); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.react .face { width: 64px; height: 64px; border-radius: 8px; flex: none; display: grid; place-items: center; font-family: var(--display); font-size: 30px; color: var(--tile-ink); background: var(--gold); }
.react p { margin: 0; font-size: 14px; line-height: 1.45; color: var(--muted); min-width: 0; }
.react p b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 2px; }
.facts { display: flex; flex-wrap: wrap; gap: 10px 22px; font-size: 14px; color: var(--muted); }
.facts b { color: var(--ink); font-variant-numeric: tabular-nums; }
.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn-primary {
  background: var(--gold); color: var(--tile-ink); border: 0; border-radius: 6px;
  font-family: var(--display); font-size: 24px; letter-spacing: .05em; text-transform: uppercase;
  padding: 12px 30px; box-shadow: 0 5px 0 var(--gold-deep); transition: transform .08s, box-shadow .08s;
}
.btn-primary:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--gold-deep); }
.btn-ghost { background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 10px 16px; font-weight: 600; color: var(--ink); }
.btn-ghost:hover { border-color: var(--muted); }
.toggle { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); user-select: none; }
.toggle input { width: 18px; height: 18px; accent-color: var(--gold); }

/* data sheet */
.sheet { background: var(--court); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.sheet h3 { margin: 0; font-family: var(--display); font-weight: 400; letter-spacing: .04em; font-size: 22px; text-transform: uppercase; }
.sheet p { margin: 0; color: var(--muted); font-size: 14px; max-width: 70ch; }
.cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px 18px; font-size: 14px; margin: 0; padding: 0; list-style: none; }
.cols code { color: var(--gold); }
.cols span { color: var(--muted); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; font-family: var(--mono); font-size: 13px; width: 100%; min-width: 520px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; }
td.num { font-variant-numeric: tabular-nums; text-align: right; }

/* scoreboard */
.board { display: grid; grid-template-columns: auto 1fr auto auto; gap: 16px; align-items: center; background: #120c19; border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px; }
.board .q { font-family: var(--display); font-size: 22px; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.board .lec { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.stat { text-align: right; line-height: 1.1; }
.stat small { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.stat b { font-family: var(--display); font-weight: 400; font-size: 24px; font-variant-numeric: tabular-nums; }
.stat.streak b { color: var(--gold); }
.timer { height: 8px; background: var(--court-2); border-radius: 4px; overflow: hidden; }
.timer i { display: block; height: 100%; width: 100%; background: var(--gold); transform-origin: left; }
.timer.low i { background: var(--bad); }
.timer-row { display: flex; align-items: center; gap: 12px; }
.timer-row .timer { flex: 1; }
.timer-row .secs { font-family: var(--display); font-size: 20px; width: 3ch; text-align: right; font-variant-numeric: tabular-nums; }

.prompt { background: var(--court); border: 1px solid var(--line); border-radius: 8px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.prompt h2 { margin: 0; font-size: clamp(19px, 2.6vw, 23px); line-height: 1.35; font-weight: 700; text-wrap: balance; max-width: 62ch; }
.prompt pre { margin: 0; background: #120c19; border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; overflow-x: auto; font-size: 14.5px; line-height: 1.55; color: #f3e6c8; }
.sheet-link { align-self: flex-start; background: none; border: 0; padding: 0; color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile {
  display: flex; align-items: center; gap: 14px; text-align: left; min-height: 86px;
  border: 0; border-radius: 8px; padding: 14px 18px; color: var(--tile-ink);
  font-weight: 700; font-size: 16px; line-height: 1.35;
  box-shadow: 0 5px 0 rgba(0,0,0,.35); transition: transform .08s, opacity .2s, filter .2s; min-width: 0;
}
.tile:hover:not(:disabled) { transform: translateY(-2px); }
.tile:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
.tile .shape { flex: none; width: 30px; height: 30px; }
.tile .txt { min-width: 0; overflow-wrap: anywhere; }
.tile code { font-family: var(--mono); font-size: 14px; font-weight: 600; }
.tile .key { margin-left: auto; flex: none; font-family: var(--mono); font-size: 12px; opacity: .6; }
.tile:nth-child(1) { background: var(--t1); }
.tile:nth-child(2) { background: var(--t2); }
.tile:nth-child(3) { background: var(--t3); }
.tile:nth-child(4) { background: var(--t4); }
.tile:disabled { cursor: default; }
.tile.dim { opacity: .28; filter: saturate(.4); }
.tile.right { outline: 4px solid var(--good); outline-offset: 3px; }
.tile.picked.wrong { outline: 4px solid var(--bad); outline-offset: 3px; }
.tile .mark { margin-left: auto; font-family: var(--display); font-size: 18px; letter-spacing: .04em; }

/* lower third reveal */
.reveal { border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--court); animation: rise .35s ease-out; }
@keyframes rise { from { transform: translateY(12px); opacity: .4; } to { transform: none; opacity: 1; } }
.reveal .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 18px; font-family: var(--display); letter-spacing: .05em; font-size: 24px; text-transform: uppercase; }
.reveal.ok .bar { background: var(--good); color: var(--tile-ink); }
.reveal.no .bar { background: var(--bad); color: var(--tile-ink); }
.reveal .bar .pts { font-variant-numeric: tabular-nums; }
.reveal .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px; }
.reveal .why { margin: 0; max-width: 68ch; }
.why-img { display: block; width: 100%; max-width: 440px; height: auto; background: #fff; border-radius: 6px; padding: 6px; }
.reveal .why code { font-family: var(--mono); font-size: 14px; color: #f3e6c8; }
.glaze { margin: 0; display: flex; gap: 12px; align-items: center; color: var(--gold); font-weight: 600; font-style: italic; }
.glaze .lbl { display: block; font-style: normal; font-size: 10px; letter-spacing: .16em; font-weight: 800; color: var(--muted); }
.reveal .next { align-self: flex-end; }

/* results */
.end { display: flex; flex-direction: column; gap: 32px; }
.final { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.lead { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.lead .head { display: flex; flex-direction: column; gap: 8px; }
.big { font-family: var(--display); font-size: clamp(72px, 16vw, 132px); line-height: .9; color: var(--gold); font-variant-numeric: tabular-nums; }
.rank { font-family: var(--display); font-size: clamp(26px, 4vw, 34px); text-transform: uppercase; letter-spacing: .03em; line-height: 1.05; text-wrap: balance; }
.rank-sub { color: var(--muted); margin: 0; max-width: 46ch; }
.splits { background: var(--court); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.splits h3, .missed h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 20px; letter-spacing: .05em; text-transform: uppercase; }
.missed h3 + p { margin: 0; color: var(--muted); font-size: 14px; }
.split { display: grid; grid-template-columns: 8.5em minmax(0, 1fr) 2.6em; gap: 12px; align-items: center; font-size: 14px; }
.split .meter { height: 10px; background: var(--court-2); border-radius: 5px; overflow: hidden; }
.split .meter i { display: block; height: 100%; background: var(--gold); }
.split .meter i.lowv { background: var(--muted); }
.split .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.missed { display: flex; flex-direction: column; gap: 10px; }
.missed .list { display: flex; flex-direction: column; gap: 10px; }
.miss { background: var(--court); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 6px; padding: 12px 14px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.miss .mq { font-weight: 700; }
.miss .ma { color: var(--muted); }
.miss code { font-family: var(--mono); font-size: 13px; color: #f3e6c8; overflow-wrap: anywhere; }
.best { margin: 0; font-size: 14px; color: var(--muted); }
.end .controls, .end footer { margin: 0; }
.best b { color: var(--ink); font-variant-numeric: tabular-nums; }
footer { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }

@media (max-width: 640px) {
  .hero { grid-template-columns: 1fr; }
  .card { justify-self: center; max-width: 230px; transform: rotate(1.5deg); }
  .tiles { grid-template-columns: 1fr; }
  .tile { min-height: 64px; }
  .board { grid-template-columns: auto 1fr auto; }
  .board .stat.streak { display: none; }
  .end { gap: 28px; }
  .final { grid-template-columns: minmax(0, 1fr); gap: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  .ticker .track { animation: none; padding-left: 0; }
  .reveal { animation: none; }
  .tile, .btn-primary { transition: none; }
}
</style>
</head>
<body>
<div class="ticker" aria-label="Professor Chi news ticker">
  <div class="tag">CHI WIRE</div>
  <div class="ticker-view"><div class="track" id="ticker"></div></div>
</div>

<main class="wrap" id="app"></main>

<script>
const GLAZE_TICKER = [
  "<b>BREAKING:</b> Professor Chi answered a babypandas question before the student finished typing it",
  "<b>CONFIRMED:</b> Professor Chi's office hours run in O(1) time",
  "Professor Chi doesn't use <b>.loc</b> or <b>.iloc</b>. The rows come to Professor Chi.",
  "<b>REPORT:</b> Professor Chi fixed a KeyError just by looking at it",
  "Professor Chi can explain a merge in one sentence and a diagram",
  "The midterm is scared of Professor Chi, not the other way around",
  "<b>STAT:</b> 0 merges have ever had the wrong row count in Professor Chi's presence",
  "Professor Chi once explained density histograms so well the bars got shorter out of respect",
  "Analysts agree: <b>Peter Chi is the GOAT of DSC 10.</b> Debate is over."
];

const QS = [
  { lec: 3, topic: "Strings", t: 30,
    text: 'Professor Chi\'s nameplate is s = "**Chi-GOAT**". What does this evaluate to?',
    code: 's.strip("*C").split("-")[0]',
    opts: ['`"Chi"`', '`"hi"`', '`"**Chi"`', '`"GOAT"`'], a: 1,
    why: '`.strip("*C")` removes any leading or trailing characters in the <b>set</b> {*, C}, not the substring. The front loses "**C", the back loses "**", leaving "hi-GOAT". Split on "-" and take [0]: "hi".',
    glaze: "Even .strip() can't take the GOAT out of Professor Chi. It just says hi." },
  { lec: 3, topic: "Arrays", t: 30,
    text: "Professor Chi's minutes per question, in array form. What does this evaluate to?",
    code: '(np.arange(5, 25, 5) * 2 - 10).mean()',
    opts: ['`15.0`', '`20.0`', '`12.5`', '`30.0`'], a: 0,
    why: '`np.arange(5, 25, 5)` is [5, 10, 15, 20] since the stop value is excluded. Times 2 minus 10 gives [0, 10, 20, 30], with mean 15. Including 25 by mistake gives 20.',
    glaze: "np.arange leaves out 25. Professor Chi leaves no student behind." },
  { lec: 5, topic: "Querying", t: 20,
    text: "What is the data type of this expression?",
    code: 'oh.get("minutes") > 5',
    opts: ['bool', 'Series', 'DataFrame', 'array'], a: 1,
    why: 'Comparing a Series to a number works element by element, giving a Boolean Series with one True/False per row. That is what goes inside the brackets when you query.',
    glaze: "One True per row. Like one W per student Professor Chi helps." },
  { lec: 4, topic: "DataFrames", t: 30,
    text: "oh has the default index 0, 1, 2, … What does this return?",
    code: 'oh.sort_values("rating", ascending=False).get("student").loc[0]',
    opts: ['The student who rated Professor Chi highest', 'The student who rated Professor Chi lowest', 'The student in the first row of the original oh', 'An error'], a: 2,
    why: 'Sorting moves rows but they keep their index labels. `.loc[0]` finds the row <b>labeled</b> 0, which is the original first row wherever it landed. For the top-rated row you need `.iloc[0]`.',
    glaze: "Sorting Professor Chi's ratings is pointless anyway. They're all fives." },
  { lec: 5, topic: "Querying", t: 30,
    text: 'Which expression evaluates to the number of questions Professor Chi solved? ("solved" is a bool column)',
    opts: ['`oh.get("solved").count()`', '`oh.get("solved").sum()`', '`oh[oh.get("solved")].shape[1]`', '`oh[oh.get("solved") == True].shape`'], a: 1,
    why: 'True counts as 1 in a sum. `.count()` counts every non-missing value, so all rows. `shape[1]` is the number of <b>columns</b>, and `.shape` is a tuple, not an integer.',
    glaze: "Spoiler: the answer is basically oh.shape[0]." },
  { lec: 5, topic: "Querying", t: 30,
    text: "What happens when you run this?",
    code: 'oh[oh.get("minutes") > 5 & oh.get("rating") > 4]',
    opts: ['Questions over 5 min with rating over 4', 'Questions over 5 min OR rating over 4', 'An empty DataFrame', 'An error'], a: 3,
    why: '`&` binds tighter than `>`, so Python tries `5 & oh.get("rating")` first, which errors. Each condition needs its own parentheses: `(cond1) & (cond2)`.',
    glaze: "Professor Chi would have spotted the missing parentheses from across Geisel." },
  { lec: 6, topic: "Grouping", t: 40,
    text: "What does this evaluate to?",
    code: 'oh.get(["location", "rating"]).groupby("location")\n  .mean().get("rating").iloc[-1]',
    opts: ['The highest average rating of any location', 'The average rating at the alphabetically last location', 'The rating in the last row of oh', 'The name of Professor Chi\'s best location'], a: 1,
    why: '`.groupby` sorts its index alphabetically. Nothing here sorts by rating, so `.iloc[-1]` is just the alphabetically last location\'s mean rating.',
    glaze: "Trick question. Professor Chi's best location is wherever he is standing." },
  { lec: 6, topic: "Visualization", t: 30,
    text: "You want to compare the DISTRIBUTION of minutes spent on solved vs. unsolved questions. Which visualization is best?",
    opts: ['Overlaid density histograms of minutes', 'Bar chart of mean minutes, solved vs. unsolved', 'Scatter plot of minutes vs. solved', 'Line plot of minutes vs. solved'], a: 0,
    why: 'The distribution of a numerical variable calls for a histogram. Overlaid <b>density</b> histograms compare groups fairly even when they have very different sizes. A bar chart of means only shows the center.',
    glaze: "Density matters here. The unsolved group has like three questions in it." },
  { lec: 7, topic: "Histograms", t: 60,
    text: "A density histogram of minutes for Professor Chi's 200 questions has bins [2, 4), [4, 6), [6, 10]. The [4, 6) bar has height 0.15 and the [6, 10] bar has height 0.05. How many questions took at least 2 but less than 4 minutes?",
    opts: ['100', '160', '50', '120'], a: 0,
    why: 'Area is proportion. [4, 6): 2 × 0.15 = 0.3. [6, 10]: 4 × 0.05 = 0.2. Total area is 1, so [2, 4) holds 0.5, and 0.5 × 200 = 100. Treating heights as proportions gives the 160 trap.',
    glaze: "Half of all questions solved in under 4 minutes. Speedrun champion." },
  { lec: 7, topic: "Histograms", t: 45, img: "img/q10-hist.png",
    text: "Same 200 questions, redrawn as a density histogram with bins [2, 6), [6, 10]. What is the height of the [2, 6) bar?",
    opts: ['0.8', '0.4', '0.2', '0.1'], a: 2,
    why: '[2, 6) holds 0.5 + 0.3 = 0.8 of the data. Height = area ÷ width = 0.8 ÷ 4 = 0.2.',
    glaze: "Professor Chi divides by the bin width in his sleep." },
  { lec: 8, topic: "Functions & apply", t: 40,
    text: 'In oh.get("minutes").apply(hype), what is the entry for a 7-minute question?',
    code: 'def hype(m):\n    if m > 5:\n        print("Chi cooked")\n    else:\n        return "quick W"',
    opts: ['`"Chi cooked"`', '`"quick W"`', '`None`', 'An error'], a: 2,
    why: '`print` shows text but returns nothing. A function that finishes without hitting a `return` returns `None`, and that is what `.apply` stores.',
    glaze: "Professor Chi cooked, but the function never served it. print ≠ return." },
  { lec: 9, topic: "Grouping on multiple columns", t: 45,
    text: "oh has 5 locations. Every location has solved questions, and exactly one location has NO unsolved questions. How many rows does this have?",
    code: 'oh.groupby(["location", "solved"]).count()',
    opts: ['10', '9', '5', '7'], a: 1,
    why: 'Grouping on two columns makes one row per combination that actually appears. 5 locations × 2 values of solved = 10 possible, minus the one missing combination = 9.',
    glaze: "That flawless location with zero unsolved questions? Professor Chi's home court." },
  { lec: 9, topic: "Merging", t: 60,
    text: 'In oh, "Geisel" appears 3 times, "SDSC" 2 times, "Zoom" 1 time. In snacks (snacks Professor Chi brought to OH), "Geisel" appears 2 times, "SDSC" 1 time, "Price Center" 4 times. How many rows does this have?',
    code: 'oh.merge(snacks, on="location")',
    opts: ['6', '5', '8', '13'], a: 2,
    why: 'Every matching pair of rows becomes a row. Geisel: 3 × 2 = 6. SDSC: 2 × 1 = 2. Zoom and Price Center have no partner. Total: 8.',
    glaze: "Brings snacks AND teaches merges. Generational." },
  { lec: 10, topic: "Conditionals", t: 40,
    text: "What does glaze_level(8) return?",
    code: 'def glaze_level(m):\n    if m >= 3 or m < 6:\n        return "elite"\n    elif m >= 6:\n        return "GOAT"\n    return "great"',
    opts: ['`"GOAT"`', '`"elite"`', '`"great"`', '`None`'], a: 1,
    why: '`8 >= 3` is True, so the whole `or` condition is True and the function returns "elite" right away. With `or`, every number takes the first branch. It should have been `and`.',
    glaze: "One sneaky or, a totally different answer. Professor Chi reads every condition twice." },
  { lec: 10, topic: "Iteration", t: 45,
    text: "What is rings after the loop?",
    code: 'rings = 0\nfor x in np.arange(1, 10, 3):\n    if x % 2 == 0:\n        rings = rings + x\n    else:\n        rings = rings - 1',
    opts: ['2', '12', '3', '-3'], a: 0,
    why: 'x takes 1, 4, 7 (10 is excluded). 1 is odd: −1. 4 is even: 3. 7 is odd: 2. Including 10 by mistake gives 12.',
    glaze: "Two rings from one loop. Professor Chi has more than that from Week 1 OH alone." },
  { lec: 11, topic: "Probability", t: 30,
    text: "Each student independently has a 0.2 chance of needing Professor Chi to explain something twice. Out of 5 students, what is P(at least one needs a second explanation)?",
    opts: ['0.2⁵', '1 − 0.8⁵', '1 − 0.2⁵', '5 × 0.2'], a: 1,
    why: 'Complement: P(at least one) = 1 − P(none) = 1 − 0.8⁵. The option 1 − 0.2⁵ is the complement of "all five need it", a different event.',
    glaze: "Asking twice is how learning works. Professor Chi is always happy to explain it again." },
  { lec: 11, topic: "Probability", t: 45,
    text: "60% of Professor Chi's questions are in person and 40% are on Zoom. In person, Professor Chi draws a diagram 25% of the time; on Zoom, 50% of the time. What is P(a random question gets a diagram)?",
    opts: ['0.375', '0.35', '0.15', '0.75'], a: 1,
    why: 'Split into in-person-and-diagram plus Zoom-and-diagram. Multiplication rule: 0.6 × 0.25 + 0.4 × 0.5 = 0.15 + 0.20 = 0.35. Averaging 0.25 and 0.5 ignores that in-person is more common.',
    glaze: "Professor Chi's Zoom diagrams hit harder than most people's in-person ones." },
  { lec: 11, topic: "Conditional probability", t: 40,
    text: "A question is chosen at random from oh. Which expression gives P(solved | quick)?",
    code: 'is_solved = oh.get("solved")\nis_quick = oh.get("minutes") < 4',
    opts: ['`(is_solved & is_quick).sum() / oh.shape[0]`', '`(is_solved & is_quick).sum() / is_solved.sum()`', '`(is_solved & is_quick).sum() / is_quick.sum()`', '`is_solved.sum() / is_quick.sum()`'], a: 2,
    why: 'Given "quick", the quick questions are the whole universe, so divide by how many are quick. The numerator counts questions that are both. The second option is P(quick | solved).',
    glaze: "P(solved | Professor Chi) = 1. No simulation needed." },
  { lec: 12, topic: "Simulation", t: 30,
    text: "At the end of OH, Professor Chi shouts out 3 DIFFERENT random students. In a simulation, which call draws one set of shout-outs?",
    code: 'students = np.array(oh.get("student"))',
    opts: ['`np.random.choice(students, 3, replace=True)`', '`np.random.choice(students, 3, replace=False)`', '`np.random.choice(students, repetitions, replace=False)`', '`np.random.choice(3, students, replace=False)`'], a: 1,
    why: '"Different" means no repeats, so draw 3 without replacement. The number of repetitions belongs to the for-loop, not the sample size.',
    glaze: "No repeats. Professor Chi's shout-outs are limited edition." }
];

const SHAPES = [
  '<svg class="shape" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 3 L28 26 H2 Z" fill="#1b1024"/></svg>',
  '<svg class="shape" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 2 L28 15 L15 28 L2 15 Z" fill="#1b1024"/></svg>',
  '<svg class="shape" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12" fill="#1b1024"/></svg>',
  '<svg class="shape" viewBox="0 0 30 30" aria-hidden="true"><rect x="4" y="4" width="22" height="22" fill="#1b1024"/></svg>'
];

const RIGHT_BARS = ["Professor Chi would be proud", "That's a Chi-level read", "Clean. Bucket.", "Certified Professor Chi student", "Cooking like Professor Chi"];
const WRONG_BARS = ["Good try. Here's the trick", "So close", "This one trips up a lot of people", "Now you'll know it Monday", "Great one to learn from"];

const app = document.getElementById("app");
document.getElementById("ticker").innerHTML = GLAZE_TICKER.map(s => "<span>" + s + "</span>").join("");

function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
// `code` spans in option/explanation strings; other HTML (like <b>) is authored by us
function md(s) { return s.replace(/`([^`]+)`/g, (_, c) => "<code>" + esc(c) + "</code>"); }

let S = { screen: "start", i: 0, score: 0, streak: 0, best: 0, timerOn: true, log: [], picked: null, startedAt: 0, pts: 0 };
let tick = null;

function getBest() { try { return +localStorage.getItem("chihoot-best") || 0; } catch (e) { return 0; } }
function setBest(v) { try { localStorage.setItem("chihoot-best", String(v)); } catch (e) {} }

const SAMPLE = [
  ["Maya", "groupby", 3.5, 5.0, "Geisel", "True"],
  ["Diego", "merge", 8.0, 5.0, "SDSC", "True"],
  ["Priya", "histograms", 4.5, 4.9, "Zoom", "True"],
  ["Jordan", "for-loops", 2.0, 5.0, "Geisel", "True"],
  ["Ava", "probability", 11.5, 4.8, "Price Center", "False"]
];

function sheetHTML() {
  return `<section class="sheet" aria-label="Data description">
    <h3>The data: <code style="font-family:var(--mono);color:var(--gold);font-size:18px;text-transform:none">oh</code></h3>
    <p>One row for every office-hours question Professor Chi answered this quarter. Assume <code>import babypandas as bpd</code> and <code>import numpy as np</code> have run.</p>
    <ul class="cols">
      <li><code>"student"</code> <span>(str) who asked</span></li>
      <li><code>"topic"</code> <span>(str) what it was about</span></li>
      <li><code>"minutes"</code> <span>(float) time Professor Chi spent on it</span></li>
      <li><code>"rating"</code> <span>(float) student's rating of the help, out of 5</span></li>
      <li><code>"location"</code> <span>(str) where OH happened</span></li>
      <li><code>"solved"</code> <span>(bool) whether it got solved</span></li>
    </ul>
    <div class="tbl-wrap"><table>
      <thead><tr><th></th><th>student</th><th>topic</th><th>minutes</th><th>rating</th><th>location</th><th>solved</th></tr></thead>
      <tbody>${SAMPLE.map((r, k) => `<tr><td>${k}</td><td>${r[0]}</td><td>${r[1]}</td><td class="num">${r[2].toFixed(1)}</td><td class="num">${r[3].toFixed(1)}</td><td>${r[4]}</td><td>${r[5]}</td></tr>`).join("")}</tbody>
    </table></div>
    <p>First five rows shown. The full DataFrame is much larger.</p>
  </section>`;
}

function renderStart() {
  const best = getBest();
  app.innerHTML = `
    <section class="hero">
      <div>
        <div class="eyebrow">DSC 10 · Fall 2026 · Midterm Review</div>
        <h1 class="wordmark">Chi<span class="gold">hoot</span></h1>
        <p class="lede">Nineteen midterm-style questions covering Lectures 1–12, modeled on past exams from your instructors. Every one is built around a trap that dropped real exam averages into the 50–70% range. </p>
      </div>
      ${cardHTML()}
    </section>
    <div class="facts">
      <span><b>19</b> questions</span><span><b>Lectures 1–12</b></span><span>Up to <b>1,000</b> pts each, plus streak bonus</span>
      ${best ? `<span>Your best: <b>${best.toLocaleString()}</b></span>` : ""}
    </div>
    <div class="controls">
      <button class="btn-primary" id="go">Tip off</button>
      <label class="toggle"><input type="checkbox" id="timerToggle" ${S.timerOn ? "checked" : ""}> Game timer (turn off for study mode)</label>
    </div>
    ${sheetHTML()}
    <footer>Questions are original, written in the style of practice.dsc10.com midterms (FA25, WI26, SP26, SU26). Press 1–4 to answer and Enter to continue.</footer>`;
  document.getElementById("go").onclick = startGame;
  document.getElementById("timerToggle").onchange = e => { S.timerOn = e.target.checked; };
}

function cardHTML() {
  return `<figure class="card" style="margin:0" aria-label="Professor Chi's player card">
    <div class="photo mono" role="img" aria-label="Professor Chi monogram"><span class="pc">PC</span><span class="num">10</span><span class="badge">GOAT</span></div>
    <div class="plate"><b>Prof. Chi</b><span>Instructor · DSC 10</span></div>
    <dl><div><dt>Lectures</dt><dd>25</dd></div><div><dt>Rating</dt><dd>5.0</dd></div><div><dt>Bugs left</dt><dd>0</dd></div></dl>
  </figure>`;
}

function startGame() {
  S.i = 0; S.score = 0; S.streak = 0; S.best = 0; S.log = [];
  showQuestion();
}

function showQuestion() {
  S.screen = "q"; S.picked = null;
  const q = QS[S.i];
  app.innerHTML = `
    <div class="board">
      <div><div class="q">Q${S.i + 1}<span style="color:var(--muted)">/${QS.length}</span></div></div>
      <div class="lec">Lecture ${q.lec} · ${q.topic}</div>
      <div class="stat streak"><small>Streak</small><b>${S.streak}</b></div>
      <div class="stat"><small>Score</small><b>${S.score.toLocaleString()}</b></div>
    </div>
    ${S.timerOn ? `<div class="timer-row"><div class="timer" id="timer"><i id="timerFill"></i></div><span class="secs" id="secs">${q.t}</span></div>` : ""}
    <section class="prompt">
      <h2>${md(esc(q.text))}</h2>
      ${q.code ? `<pre>${esc(q.code)}</pre>` : ""}
      <button class="sheet-link" id="sheetBtn">Show data sheet</button>
      <div id="sheetSlot" hidden></div>
    </section>
    <div class="tiles" role="group" aria-label="Answer choices">
      ${q.opts.map((o, k) => `<button class="tile" data-k="${k}">${SHAPES[k]}<span class="txt">${md(o)}</span><span class="key">${k + 1}</span></button>`).join("")}
    </div>
    <div id="revealSlot"></div>`;
  app.querySelectorAll(".tile").forEach(b => b.onclick = () => answer(+b.dataset.k));
  const sb = document.getElementById("sheetBtn");
  sb.onclick = () => {
    const slot = document.getElementById("sheetSlot");
    if (slot.hidden) { slot.innerHTML = sheetHTML(); slot.hidden = false; sb.textContent = "Hide data sheet"; }
    else { slot.hidden = true; sb.textContent = "Show data sheet"; }
  };
  S.startedAt = performance.now();
  clearInterval(tick);
  if (S.timerOn) {
    tick = setInterval(() => {
      const el = (performance.now() - S.startedAt) / 1000;
      const left = Math.max(0, q.t - el);
      const fill = document.getElementById("timerFill");
      if (!fill) return;
      fill.style.transform = `scaleX(${left / q.t})`;
      document.getElementById("secs").textContent = Math.ceil(left);
      document.getElementById("timer").classList.toggle("low", left < 6);
      if (left <= 0) answer(-1);
    }, 100);
  }
  window.scrollTo({ top: 0 });
}

function answer(k) {
  if (S.picked !== null) return;
  clearInterval(tick);
  const q = QS[S.i];
  S.picked = k;
  const ok = k === q.a;
  let pts = 0;
  if (ok) {
    const el = (performance.now() - S.startedAt) / 1000;
    const frac = S.timerOn ? Math.min(1, el / q.t) : 0;
    S.streak += 1;
    pts = Math.round(1000 * (1 - frac / 2)) + Math.min(500, (S.streak - 1) * 100);
  } else {
    S.streak = 0;
  }
  S.score += pts; S.pts = pts;
  S.log.push({ i: S.i, k, ok });
  app.querySelectorAll(".tile").forEach(b => {
    const j = +b.dataset.k;
    b.disabled = true;
    if (j === q.a) { b.classList.add("right"); b.insertAdjacentHTML("beforeend", '<span class="mark">✓</span>'); b.querySelector(".key").remove(); }
    else if (j === k) { b.classList.add("picked", "wrong"); }
    else b.classList.add("dim");
  });
  const bar = ok ? RIGHT_BARS[S.i % RIGHT_BARS.length] : (k === -1 ? "Out of time. Here's how it works" : WRONG_BARS[S.i % WRONG_BARS.length]);
  const last = S.i === QS.length - 1;
  document.getElementById("revealSlot").innerHTML = `
    <section class="reveal ${ok ? "ok" : "no"}" aria-live="polite">
      <div class="bar"><span>${bar}</span><span class="pts">${ok ? "+" + pts.toLocaleString() : "+0"}</span></div>
      <div class="body">
        <p class="why">${md(q.why)}</p>
        ${q.img ? `<img class="why-img" src="${q.img}" alt="Density histogram of minutes with bins [2, 6) and [6, 10]: the [2, 6) bar has height 0.2 and the [6, 10] bar has height 0.05.">` : ""}
        <p class="glaze"><span class="avatar" aria-hidden="true">PC</span><span><span class="lbl">CHI WATCH</span>${esc(q.glaze)}</span></p>
        <button class="btn-primary next" id="next">${last ? "Final buzzer" : "Next"}</button>
      </div>
    </section>`;
  const stat = app.querySelectorAll(".stat b");
  stat[0].textContent = S.streak; stat[1].textContent = S.score.toLocaleString();
  const nx = document.getElementById("next");
  nx.onclick = next; nx.focus({ preventScroll: true });
  document.getElementById("revealSlot").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" });
}

function next() {
  if (S.i < QS.length - 1) { S.i += 1; showQuestion(); }
  else showResults();
}

function rankFor(pct) {
  if (pct >= 90) return ["Chi-level", "You're ready. Walk into Monday with confidence."];
  if (pct >= 75) return ["First-team All-Chi", "Strong work. A quick look at the few questions below and you're set."];
  if (pct >= 60) return ["Right on track", "That's exactly where these questions are designed to land. Review the ones below and you'll pick up points fast."];
  if (pct >= 40) return ["Building momentum", "You have a real foundation. Each question below lists its lecture, so you know exactly where to look next."];
  return ["Warm-up round", "These questions are built to be tricky, so this is a normal place to start. Each one below points to a lecture to revisit, and it gets easier with every round."];
}

function showResults() {
  S.screen = "end";
  const right = S.log.filter(l => l.ok).length;
  const pct = Math.round(100 * right / QS.length);
  const prev = getBest();
  if (S.score > prev) setBest(S.score);
  const [rank, sub] = rankFor(pct);
  const groups = [
    ["Strings & arrays", [3]], ["DataFrames", [4, 5]], ["Grouping & viz", [6]],
    ["Histograms", [7]], ["Apply & merge", [8, 9]], ["Control flow", [10]],
    ["Probability", [11]], ["Simulation", [12]]
  ];
  const splits = groups.map(([name, lecs]) => {
    const items = S.log.filter(l => lecs.includes(QS[l.i].lec));
    const r = items.filter(l => l.ok).length;
    const p = items.length ? r / items.length : 0;
    return `<div class="split"><span>${name}</span><span class="meter"><i class="${p < 0.6 ? "lowv" : ""}" style="width:${Math.max(3, p * 100)}%"></i></span><span class="v">${r}/${items.length}</span></div>`;
  }).join("");
  const misses = S.log.filter(l => !l.ok).map(l => {
    const q = QS[l.i];
    return `<div class="miss"><span class="mq">Q${l.i + 1} · Lecture ${q.lec} · ${q.topic}</span>
      <span class="ma">${l.k === -1 ? "Ran out of time." : "Your pick: " + md(q.opts[l.k])} · Answer: ${md(q.opts[q.a])}</span></div>`;
  }).join("");
  const react = pct >= 90 ? ["Professor Chi: \u201cThat's my student.\u201d", "You've put in the work. Trust it on Monday."]
    : pct >= 60 ? ["Professor Chi would be proud of this one.", "Keep this energy going into Monday."]
    : ["Professor Chi's office hours are open to you.", "Practice rounds are where the learning happens. Review, play again, and watch your score climb."];
  app.innerHTML = `
    <div class="end">
      <section class="final">
        <div class="lead">
          <div class="eyebrow">Final buzzer</div>
          <div class="head">
            <div class="big">${S.score.toLocaleString()}</div>
            <div class="rank">${rank}</div>
            <p class="rank-sub">${right} of ${QS.length} correct (${pct}%). ${sub}</p>
          </div>
          <div class="react"><span class="face" aria-hidden="true">PC</span><p><b>${react[0]}</b>${react[1]}</p></div>
          <p class="best">${S.score > prev ? "New personal best." : `Personal best: <b>${prev.toLocaleString()}</b>`}</p>
        </div>
        <div class="splits"><h3>Box score by topic</h3>${splits}</div>
      </section>
      ${misses ? `<section class="missed"><h3>Review these next</h3><p>Every question here is a point you can pick up on Monday.</p><div class="list">${misses}</div></section>` : `<p class="glaze"><span class="avatar" aria-hidden="true">PC</span><span>Perfect game. Professor Chi is reportedly tearing up.</span></p>`}
      <div class="controls">
        <button class="btn-primary" id="again">Play again</button>
        <button class="btn-ghost" id="home">Back to start</button>
      </div>
      <footer>Want more practice? Work the full past midterms at practice.dsc10.com under exam conditions, newest first.</footer>
    </div>`;
  document.getElementById("again").onclick = startGame;
  document.getElementById("home").onclick = renderStart;
  window.scrollTo({ top: 0 });
}

document.addEventListener("keydown", e => {
  if (S.screen !== "q") return;
  if (S.picked === null && ["1","2","3","4"].includes(e.key)) answer(+e.key - 1);
  else if (S.picked !== null && e.key === "Enter" && document.activeElement?.id !== "next") next();
});

function boot(data) {
  if (data && data.S) {
    S = Object.assign(S, data.S);
    if (S.screen === "q") { if (S.picked !== null) next(); else showQuestion(); return; }
    if (S.screen === "end") { showResults(); return; }
  }
  renderStart();
}
boot({});
</script>
</body>
</html>
